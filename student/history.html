<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLU PrintDesk | History</title>
  <link rel="stylesheet" href="../style/style.css" />
  <link rel="stylesheet" href="../style/history.css">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="../script/config.js"></script>
  <script src="../script/main.js" defer></script>
  <script src="../script/history.js" defer></script>
  <link rel="icon" type="image/png" href="../images/Icon.png" size="32x32">
</head>

<body class="history-body">
  <!-- NAVIGATION BAR -->
  <header class="navbar">
    <div class="logo" id="logoRefresh" style="cursor: pointer;">
      <img src="../images/student_img/SLU_printdesk_logo.png" alt="SLU PrintDesk" />
    </div>

    <nav>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="submission.html">Submission</a></li>
        <li><a href="history.html" class="active">History</a></li>
      </ul>
    </nav>

    <button id="hamburgerBtn" class="hamburger" aria-label="Open menu">
      <span class="hamburger-icon" aria-hidden="true">☰</span>
    </button>

    <div class="profile-icon">
      <img id="nav-profile-pic" src="../images/student_img/profile.png" alt="Profile" />
    </div>
  </header>

  <!-- Mobile Bottom Sheet (profile + nav) -->
  <div id="mobileSheet" class="mobile-sheet" aria-hidden="true">
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-handle" id="sheetHandle"></div>
      <div class="sheet-inner">
        <div class="sheet-header">
          <div class="mobile-profile">
            <img id="mobile-profile-pic" src="../images/student_img/profile.png" alt="Profile" />
            <div class="mobile-profile-info">
              <h3 id="mobileStudentName">Student Name</h3>
              <p id="mobileStudentId">Student ID</p>
            </div>
          </div>

          <nav class="mobile-nav">
            <ul>
              <li><a href="home.html">Home</a></li>
              <li><a href="submission.html">Submission</a></li>
              <li><a href="history.html" class="active">History</a></li>
            </ul>
          </nav>
        </div>

        <div class="sheet-body">
          <!-- Mobile-only content: Token balance, notifications, logout -->
          <div class="mobile-tokens" style="padding: 8px 4px; border-bottom: 1px solid #f3f3f3;">
            <h3 style="margin:0 0 8px 0; color:#1e1362; font-size:1rem;">Token Balance</h3>
            <div class="token-info" style="display:flex; gap:12px; align-items:center;">
              <div class="token-amount" style="font-weight:800; color:#1e1362;">
                <span id="mobileTokenCount">500</span>
                <span style="font-weight:600; color:#64748b; margin-left:6px; font-size:0.95rem;">tokens</span>
              </div>
              <div class="token-progress" style="flex:1;">
                <div class="progress-bar" id="mobileTokenProgressBar" style="width:0%; height:10px; border-radius:8px; background:linear-gradient(90deg,#3d348b,#1e1362);"></div>
              </div>
            </div>
          </div>

          <div class="mobile-notifications" style="padding: 10px 4px; border-bottom: 1px solid #f3f3f3;">
            <h3 style="margin:0 0 8px 0; color:#1e1362; font-size:1rem;">Notifications</h3>
            <div class="notifications-list" id="mobileNotificationsList" style="max-height:180px; overflow:auto; padding-right:6px;">
              <div style="color:#666;padding:8px;">No notifications</div>
            </div>
          </div>

          <div class="mobile-logout" style="padding:12px 4px;">
            <button id="mobileLogoutButton" class="reset-btn" style="width:100%;">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY FILTER SECTION -->
  <section class="history-filter-section">
    <div class="filter-container">
      <div class="filter-buttons">
        <button class="filter-btn active">All Jobs</button>
        <button class="filter-btn">Completed</button>
        <button class="filter-btn">Pending</button>
        <button class="filter-btn">Accepted</button>
        <button class="filter-btn">Cancelled</button>
        <button class="filter-btn">Rejected</button>
      </div>

      <!-- Academic year and semester filters -->
      <div class="filter-dropdown">
        <select id="academicYearFilter">
          <option value="">Academic Year</option>
          <option value="2024-2025">2024-2025</option>
          <option value="2025-2026">2025-2026</option>
          <option value="2026-2027">2026-2027</option>
        </select>
        <select id="semesterFilter">
          <option value="">All Semesters</option>
          <option value="1st Semester">1st Semester</option>
          <option value="2nd Semester">2nd Semester</option>
          <option value="Short Semester">Short Term</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Submission List (will be populated dynamically) -->
  <div id="submissionList" class="submission-cards"></div>

  <!-- Profile Modal -->
  <div id="profileModal" class="profile-modal">
    <div class="profile-modal-content">
      <span class="profile-modal-close">&times;</span>
      <div class="profile-header">
        <img src="../images/student_img/profile.png" alt="Profile Picture" class="profile-modal-pic">
        <div class="profile-info">
          <h2 id="studentName">Student Name</h2>
          <p id="studentId">Student ID</p>
        </div>
      </div>
      <div class="tokens-section">
        <h3>Token Balance</h3>
        <div class="token-info">
          <div class="token-amount">
            <span id="tokenCount">500</span>
            <span>tokens remaining</span>
          </div>
          <div class="token-progress">
            <div class="progress-bar" id="tokenProgressBar"></div>
          </div>
        </div>
      </div>
      <div class="notifications-section">
        <h3>Notifications</h3>
        <div class="notifications-list" id="notificationsList">
          <!-- Notifications will be dynamically added here -->
        </div>
      </div>

      <div class="logout-section">
        <button id="logoutButton" class="reset-btn">Logout</button>
      </div>
    </div>
  </div>
</body>

</html>
