<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLU PrintDesk | History</title>
  <link rel="stylesheet" href="../style/style.css" />
  <link rel="stylesheet" href="../style/history.css">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="../script/main.js" defer></script>
  <script src="../script/history.js" defer></script>
  <link rel="icon" type="image/png" href="../images/Icon.png" size="32x32">
</head>

<body class="history-body">
  <!-- NAVIGATION BAR -->
  <header class="navbar">
    <div class="logo" id="logoRefresh" style="cursor: pointer;">
      <img src="../images/student_img/SLU_printdesk_logo.png" alt="SLU PrintDesk" />
    </div>

    <nav>
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="submission.html">Submission</a></li>
        <li><a href="history.html" class="active">History</a></li>
      </ul>
    </nav>

    <div class="profile-icon">
      <img id="nav-profile-pic" src="../images/student_img/profile.png" alt="Profile" />
    </div>
  </header>

  <!-- HISTORY FILTER SECTION -->
  <section class="history-filter-section">
    <div class="filter-container">
      <div class="filter-buttons">
        <button class="filter-btn active">All Jobs</button>
        <button class="filter-btn">Completed</button>
        <button class="filter-btn">Pending</button>
        <button class="filter-btn">Accepted</button>
        <button class="filter-btn">Cancelled</button>
        <button class="filter-btn">Rejected</button>
      </div>

      <!-- Academic year and semester filters -->
      <div class="filter-dropdown">
        <select id="academicYearFilter">
          <option value="">Academic Year</option>
          <option value="2024-2025">2024-2025</option>
          <option value="2025-2026">2025-2026</option>
          <option value="2026-2027">2026-2027</option>
        </select>
        <select id="semesterFilter">
          <option value="">All Semesters</option>
          <option value="1st Semester">1st Semester</option>
          <option value="2nd Semester">2nd Semester</option>
          <option value="Short Semester">Short Term</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Profile Modal -->
  <div id="profileModal" class="profile-modal">
    <div class="profile-modal-content">
      <span class="profile-modal-close">&times;</span>
      <div class="profile-header">
        <img src="../images/student_img/profile.png" alt="Profile Picture" class="profile-modal-pic">
        <div class="profile-info">
          <h2 id="studentName">Student Name</h2>
          <p id="studentId">Student ID</p>
        </div>
      </div>
      <div class="tokens-section">
        <h3>Token Balance</h3>
        <div class="token-info">
          <div class="token-amount">
            <span id="tokenCount">500</span>
            <span>tokens remaining</span>
          </div>
          <div class="token-progress">
            <div class="progress-bar" id="tokenProgressBar"></div>
          </div>
        </div>
      </div>
      <div class="notifications-section">
        <h3>Notifications</h3>
        <div class="notifications-list" id="notificationsList">
          <!-- Notifications will be dynamically added here -->
        </div>
      </div>

      <div class="logout-section">
        <button id="logoutButton" class="reset-btn">Logout</button>
      </div>
    </div>
  </div>
</body>

</html>
