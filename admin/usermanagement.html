<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin User Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-jQf6B8VQw5s3pQKxZ0vZk4bqf6tF6y5r8i8P6b1GxZ9l1E2YQk3xG3k2y3P1X9c4n6b7R8s9T0wW3e4F5g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="usermanagement.css">
    <script src="../admin/usermanagement.js" defer></script>    
  </head>

  <body>
    <div class="app">
      <aside class="leftbar" aria-label="Main navigation">
        <div class="brand">
          <div class="logo">A</div>
        </div>

        <nav class="left-nav" role="navigation" aria-label="Sidebar">
          <a href="../admin/dashboard.html"><button class="circle-btn" title="Home (Analytics)" aria-label="Home (Analytics)"><img src="/Images/here.png" alt="Home (Analytics)" class="nav-icon"></button></a>          
          <a href="../admin/usermanagement.html"><button class="circle-btn active" title="User Management" aria-label="User Management"><img src="/Images/here.png" alt="User Management" class="nav-icon"></button></a>    
        </nav>
      </aside>

      <!-- Main area -->
      <main class="main-area" role="main">
        <header class="header">
          <div class="greeting">
            <h1>(Icon) User Management</h1>
            <div class="muted">Managing the user and their account permission</div>
          </div>

          <div class="top-actions">
            <div class="table-filter">
              <button id="tableButton" title="Table">
                <i class="fa-solid fa-filter"></i>Table
              </button>
            </div>
            
            <div class="board-filter">
              <button id="boardButton" title="Board">
                <i class="fa-solid fa-filter"></i>Board
              </button>
            </div>
            
            <div class="list-filter">
              <button id="listButton" title="List">
                <i class="fa-solid fa-filter"></i>List
              </button>
            </div>            
            
            <div class="search-wrap">
              <input id="searchInput" type="search" placeholder="Search an Organization" aria-label="Search an Organization" />
              <button id="searchClear" title="Clear" aria-label="Clear search">✕</button>
            </div>  
            
            <div class="hide-filter">
              <button id="toggleFilters" title="Hide/Show Filters">
                <i class="fa-solid fa-filter"></i> Filters
              </button>
            </div>
            
            <div class="add-user">
              <button id="addUserButton" title="+ Add User">
                <i class="fa-solid fa-filter"></i>+ Add User
              </button>
            </div>            
        
            <div class="profile-header">
              <div class="profile-circle">A</div>
            </div>
          </div>
        </header>

        <!--Above the org-table-->
        <section id="filterSection" class="filters">
          <label>
            School:
            <select id="schoolFilter">
              <option value="">All</option>
              <option value="SAMCIS">SAMCIS</option>
              <option value="SON">SON</option>
              <option value="SEA">SEA</option>
            </select>
          </label>

          <label>
            Status:
            <select id="statusFilter">
              <option value="">All</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </label>

          <button id="addFilterBtn" type="button">+ Add Filter</button>
          
          <div id="extraFilters" class="extra-filters"></div>
        </section>

        <table class="org-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll" /></th>            
              <th>Full name</th>
              <th>Email</th>
              <th>Course & Year</th>
              <th>Status</th>
              <th>Role</th>
              <th>School</th>
              <th>Programs</th>
              <th>Last Active</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="orgTableBody"></tbody>
        </table>

        <div class="pagination-controls">
          <label>
            Rows per page:
            <select id="rowsPerPage">
              <option value="3">3</option>
              <option value="5" selected>5</option>
              <option value="10">10</option>
            </select>
          </label>
          <div id="pagination"></div>
        </div>

        <footer class="footer muted">© <span id="curYear"></span> Admin User Management</footer>
      </main>
    </div>
  </body>
</html>
